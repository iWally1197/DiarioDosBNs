<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" role="img" aria-labelledby="title desc"><title id="title">Esquema dos dois mísseis e do alvo em movimento</title><desc id="desc">Esquema qualitativo, fora de escala, com o alvo movendo-se sobre uma reta e dois mísseis lançados de um ponto a distância d dessa reta; um percorre um caminho reto e o outro curva enquanto acompanha o alvo.</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#243247"/></marker><marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#247a57"/></marker><marker id="arro" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#c27a18"/></marker></defs><rect width="720" height="390" rx="16" fill="#f6f8fb"/><text x="30" y="38" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#152238">Dois mísseis perseguem o mesmo alvo</text><text x="30" y="63" font-family="Arial,sans-serif" font-size="13" fill="#536174">Esquema didático, fora de escala; as curvas são qualitativas.</text><path d="M180 325V95" stroke="#63738a" stroke-width="2" stroke-dasharray="7 6"/><path d="M180 325H620" stroke="#243247" stroke-width="2" marker-end="url(#arr)"/><path d="M180 325V88" stroke="#243247" stroke-width="2" marker-end="url(#arr)"/><text x="626" y="330" font-family="Arial,sans-serif" font-size="15" fill="#243247">x</text><text x="168" y="84" font-family="Arial,sans-serif" font-size="15" fill="#243247">y</text><circle cx="180" cy="260" r="10" fill="#e0a332" stroke="#8c5b10" stroke-width="2"/><text x="66" y="265" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#152238">alvo no instante inicial</text><path d="M180 242V190" stroke="#243247" stroke-width="2.5" marker-end="url(#arr)"/><text x="194" y="215" font-family="Arial,sans-serif" font-size="14" fill="#243247">vₐ</text><circle cx="500" cy="285" r="12" fill="#536f9a" stroke="#29466d" stroke-width="2"/><text x="516" y="290" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#152238">lançamento</text><path d="M500 285L180 135" fill="none" stroke="#247a57" stroke-width="4" marker-end="url(#arrg)"/><text x="320" y="192" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#247a57">míssil 1 · trajetória reta</text><path d="M500 285C410 270 340 210 286 168S207 139 180 135" fill="none" stroke="#c27a18" stroke-width="4" marker-end="url(#arro)"/><text x="326" y="255" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#a46612">míssil 2 · direção ao alvo</text><circle cx="180" cy="135" r="7" fill="#fff" stroke="#243247" stroke-width="2"/><text x="194" y="130" font-family="Arial,sans-serif" font-size="13" fill="#536174">interceptação</text><path d="M180 346H500" stroke="#536174" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/><text x="331" y="369" font-family="Arial,sans-serif" font-size="14" fill="#243247">d</text></svg>