<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 390" role="img" aria-labelledby="title desc"><title id="title">Três trajetórias entre os mesmos estados em um diagrama p-V</title><desc id="desc">As trajetórias A, B e C conectam os mesmos estados inicial e final; C permanece acima de B, que permanece acima de A.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#243247"/></marker></defs><rect width="660" height="390" rx="16" fill="#f6f8fb"/><text x="28" y="38" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#152238">Mesmo estado inicial e final, três trajetórias</text><path d="M105 320V80M105 320H590" fill="none" stroke="#243247" stroke-width="2" marker-end="url(#a)"/><text x="82" y="87" font-family="Arial,sans-serif" font-size="16" fill="#243247">p</text><text x="592" y="326" font-family="Arial,sans-serif" font-size="16" fill="#243247">V</text><circle cx="160" cy="285" r="6" fill="#152238"/><circle cx="520" cy="285" r="6" fill="#152238"/><text x="142" y="307" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#152238">inicial</text><text x="515" y="307" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#152238">final</text><path d="M160 285C280 275 390 266 520 245" fill="none" stroke="#26825d" stroke-width="4" marker-end="url(#a)"/><path d="M160 285C280 245 390 220 520 190" fill="none" stroke="#2d5f91" stroke-width="4" marker-end="url(#a)"/><path d="M160 285C280 205 390 150 520 120" fill="none" stroke="#c27a18" stroke-width="4" marker-end="url(#a)"/><text x="532" y="249" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#26825d">A</text><text x="532" y="194" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#2d5f91">B</text><text x="532" y="124" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#a46612">C</text><text x="28" y="365" font-family="Arial,sans-serif" font-size="12" fill="#69778b">C acima de B, e B acima de A, para os mesmos volumes.</text></svg>