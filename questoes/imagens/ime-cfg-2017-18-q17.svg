<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-labelledby="title desc">
  <title id="title">Questão 17 do IME CFG 2017/2018: colisão e movimento em pista circular</title>
  <desc id="desc">Um corpo parte do repouso no ponto A, na base de uma pista circular de raio R. Um projétil sobe verticalmente e fica alojado no corpo. O conjunto percorre a pista até B, perde contato e segue pelo ar até C, a uma distância horizontal 2R de A. A gravidade aponta para baixo.</desc>
  <rect width="600" height="300" fill="#fff"/>
  <g fill="none" stroke="#111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M95 205 A165 165 0 0 1 260 40" stroke-width="4"/>
    <path d="M15 205 H95 M260 40 V205 M95 205 H425" stroke-dasharray="11 9" stroke-width="2"/>
    <path d="M95 205 H425" stroke-width="3"/>
    <path d="M95 244 V262 M425 244 V262 M95 253 H425" stroke-width="1.7"/>
    <path d="M95 253 l12 -6 v12 z M425 253 l-12 -6 v12 z" fill="#111" stroke="none"/>
    <path d="M525 58 V106 M525 106 l-8 -14 M525 106 l8 -14" stroke-width="2.5"/>
    <path d="M95 213 l8 15 8 -15 z" fill="#d9d9d9"/>
    <rect x="103" y="190" width="18" height="15" fill="#d9d9d9"/>
    <rect x="425" y="190" width="18" height="15" fill="#d9d9d9"/>
  </g>
  <g fill="#111" font-family="Arial, Helvetica, sans-serif">
    <text x="67" y="239" font-size="22">A</text>
    <text x="255" y="30" font-size="22">B</text>
    <text x="449" y="239" font-size="22">C</text>
    <text x="274" y="111" font-size="20" font-style="italic">R</text>
    <text x="245" y="281" font-size="20" font-style="italic">2R</text>
    <text x="534" y="78" font-size="22" font-style="italic">g</text>
    <text x="124" y="230" font-size="17">projétil</text>
  </g>
</svg>
