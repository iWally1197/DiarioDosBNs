<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-labelledby="title desc">
  <title id="title">Pista com mola, trecho sem atrito e trecho com atrito</title>
  <desc id="desc">Um bloco é lançado por uma mola em A, sobe uma pista sem atrito até C, a uma altura h, e percorre cinco metros em um trecho horizontal com atrito até D.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 9 4.5 0 9Z" fill="#24354a"/>
    </marker>
    <pattern id="hatch" width="10" height="10" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#d89d3f" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="960" height="330" rx="14" fill="#ffffff"/>
  <line x1="65" y1="275" x2="895" y2="275" stroke="#708197" stroke-width="3"/>
  <line x1="90" y1="252" x2="142" y2="252" stroke="#24354a" stroke-width="4"/>
  <path d="M145 252 l9 -18 12 36 12 -36 12 36 12 -36 12 18" fill="none" stroke="#2a75b9" stroke-width="4"/>
  <rect x="214" y="231" width="48" height="42" rx="5" fill="#dbe9f8" stroke="#274a72" stroke-width="3"/>
  <text x="238" y="221" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#24354a">m</text>
  <text x="236" y="304" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#24354a">A</text>
  <path d="M262 275 C330 275 385 247 427 195 C474 139 505 110 562 110 L842 110" fill="none" stroke="#24354a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M262 275 C330 275 385 247 427 195 C474 139 505 110 562 110" fill="none" stroke="#96b7d8" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 12"/>
  <line x1="562" y1="110" x2="842" y2="110" stroke="#d89d3f" stroke-width="11" stroke-dasharray="4 12"/>
  <line x1="562" y1="110" x2="562" y2="275" stroke="#52647a" stroke-width="2" stroke-dasharray="7 7"/>
  <line x1="540" y1="270" x2="540" y2="118" stroke="#24354a" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="520" y="199" text-anchor="end" font-family="Arial, sans-serif" font-size="20" fill="#24354a">h = 10 m</text>
  <text x="562" y="89" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#24354a">C</text>
  <text x="842" y="89" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#24354a">D</text>
  <line x1="570" y1="148" x2="834" y2="148" stroke="#24354a" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="702" y="176" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#24354a">d = 5 m · trecho com atrito</text>
  <text x="395" y="302" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#52647a">Trechos A–B–C sem atrito</text>
</svg>
