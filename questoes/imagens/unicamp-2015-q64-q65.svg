<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" role="img" aria-labelledby="t d"><title id="t">Sistema hidráulico de freio a disco</title><desc id="d">Pedal aciona pistão pequeno de diâmetro d1, óleo transmite pressão ao pistão maior d2, que pressiona pastilha contra o disco preso à roda.</desc><rect width="700" height="340" fill="#fff"/><circle cx="105" cy="165" r="92" fill="#eef0f4" stroke="#252d39" stroke-width="5"/><path d="M105 73V257" stroke="#252d39" stroke-width="8"/><rect x="172" y="105" width="180" height="120" rx="22" fill="#dbe3ee" stroke="#283548" stroke-width="4"/><rect x="330" y="128" width="110" height="74" rx="16" fill="#dbe3ee" stroke="#283548" stroke-width="4"/><path d="M352 165H330M440 165H520" stroke="#50677f" stroke-width="9"/><path d="M240 225V105M230 115l10-10 10 10M230 215l10 10 10-10" fill="none" stroke="#111" stroke-width="3"/><path d="M385 198V128M375 138l10-10 10 10M375 188l10 10 10-10" fill="none" stroke="#111" stroke-width="3"/><text x="250" y="170" font-family="Arial" font-size="20">d₂</text><text x="393" y="170" font-family="Arial" font-size="20">d₁</text><path d="M440 165L530 165L575 95" fill="none" stroke="#243246" stroke-width="7"/><text x="578" y="88" font-family="Arial" font-size="18">pedal do freio</text><rect x="165" y="116" width="18" height="98" fill="#c7ced8" stroke="#333" stroke-width="2"/><text x="113" y="285" font-family="Arial" font-size="18">disco de freio</text><text x="205" y="72" font-family="Arial" font-size="18">pistão maior</text><text x="335" y="255" font-family="Arial" font-size="17">óleo de freio</text><text x="151" y="310" font-family="Arial" font-size="16">pastilha</text><path d="M260 283H355" stroke="#222" stroke-width="2"/><text x="260" y="325" font-family="Arial" font-size="17">pressão hidráulica</text></svg>