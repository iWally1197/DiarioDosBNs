<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="t d"><title id="t">Placas de capacitor com mola e dielétrico — ITA 2014, questão 5</title><desc id="d">Esquema redesenhado em três estados do capacitor: placa superior suspensa por mola sem carga externa; placa com massa m; e configuração com dielétrico, tensão V e separação r.</desc><rect width="900" height="440" fill="#fff"/><style>
 text{font-family:Arial,sans-serif;fill:#1b2a3a}.title{font-size:22px;font-weight:700}.lbl{font-size:18px}.sm{font-size:15px}
 .line{stroke:#334b63;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
 .thin{stroke:#72869a;stroke-width:2.5;fill:none}.dash{stroke:#72869a;stroke-width:2;stroke-dasharray:8 7;fill:none}
 .gold{stroke:#c58a1c;stroke-width:4;fill:none}.blue{stroke:#2580bd;stroke-width:4;fill:none}
 .red{stroke:#c54848;stroke-width:4;fill:none}.fluid{fill:#9ec9e5;opacity:.75}
</style><text x="32" y="38" class="title">Três etapas da experiência com o capacitor</text><g transform="translate(65 90)"><text x="20" y="0" class="lbl">(1) Medida de T²</text><path d="M50 42V68l-12 8 24 9-24 9 24 9-12 8V126" class="gold"/><path d="M15 130H200M15 152H200" class="line"/><path d="M105 50V130" class="thin"/><text x="42" y="190" class="sm">separação inicial r₀</text><text x="103" y="126" class="sm">placas</text><text x="112" y="65" class="sm">mola</text></g><g transform="translate(340 90)"><text x="8" y="0" class="lbl">(2) Dielétrico, V = 0</text><path d="M15 130H215M15 152H215" class="line"/><rect x="40" y="132" width="150" height="18" fill="#cce4f2"/><path d="M115 55V130" class="thin"/><text x="72" y="190" class="sm">r = r₀</text><text x="70" y="120" class="sm">meio dielétrico</text></g><g transform="translate(620 90)"><text x="8" y="0" class="lbl">(3) Dielétrico, V ≠ 0</text><path d="M15 130H215M15 148H215" class="line"/><rect x="40" y="132" width="150" height="14" fill="#cce4f2"/><path d="M115 55V130" class="thin"/><text x="60" y="190" class="sm">r = 2r₀/3</text><text x="93" y="107" class="sm">V</text></g><text x="300" y="355" class="sm">A placa superior pode oscilar e mover-se sob ação elétrica.</text></svg>