<text x="74" y="194" font-family="Arial" font-size="26" font-weight="700" fill="#26364a">A</text><text x="811" y="194" font-family="Arial" font-size="26" font-weight="700" fill="#26364a">B</text>
<path d="M430 220L500 340H360Z" fill="#d8e2ef" stroke="#26364a" stroke-width="5"/><circle cx="430" cy="218" r="9" fill="#d29a28"/><text x="420" y="376" font-family="Arial" font-size="26" font-weight="700" fill="#26364a">C</text>
<rect x="230" y="145" width="76" height="72" rx="8" fill="#5591dd" stroke="#183b68" stroke-width="4"/><text x="268" y="188" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700" fill="#fff">2,0 kg</text>
<path d="M270 220V282" stroke="#24364d" stroke-width="4"/><path d="M260 270L270 286L280 270" fill="none" stroke="#24364d" stroke-width="4"/><text x="284" y="278" font-family="Arial" font-size="23" fill="#26364a">mg</text>
