<title id="t">Prancha em equilíbrio estático</title><desc id="d">Uma prancha horizontal é apoiada em C. Uma massa de 2 quilogramas está a 3 metros à esquerda; uma força de 15 newtons atua para baixo à direita a uma distância d2.</desc>
