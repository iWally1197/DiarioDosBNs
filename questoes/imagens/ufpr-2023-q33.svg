<path d="M650 220V310" stroke="#ca4b4b" stroke-width="5"/><path d="M638 296L650 316L662 296" fill="none" stroke="#ca4b4b" stroke-width="5"/><text x="670" y="276" font-family="Arial" font-size="23" fill="#26364a">F = 15 N</text>
