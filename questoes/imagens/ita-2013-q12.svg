<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="t d"><title id="t">Prisma, raio refratado e espelho plano — ITA 2013, questão 12</title><desc id="d">Esquema redesenhado de um raio horizontal que incide em um prisma de abertura 4 graus, refrata e alcança um espelho plano; O indica o eixo de rotação do espelho.</desc><rect width="900" height="440" fill="#fff"/><style>
 text{font-family:Arial,sans-serif;fill:#1b2a3a}.title{font-size:22px;font-weight:700}.lbl{font-size:18px}.sm{font-size:15px}
 .line{stroke:#334b63;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
 .thin{stroke:#72869a;stroke-width:2.5;fill:none}.dash{stroke:#72869a;stroke-width:2;stroke-dasharray:8 7;fill:none}
 .gold{stroke:#c58a1c;stroke-width:4;fill:none}.blue{stroke:#2580bd;stroke-width:4;fill:none}
 .red{stroke:#c54848;stroke-width:4;fill:none}.fluid{fill:#9ec9e5;opacity:.75}
</style><text x="32" y="38" class="title">Refração no prisma e reflexão no espelho</text><path d="M90 180H270" class="blue"/><path d="M270 90L420 180L270 270Z" fill="#e8f3fa" stroke="#334b63" stroke-width="4"/><path d="M90 180H270L380 180" class="blue"/><path d="M380 180L600 242" class="gold"/><path d="M610 100V300" class="line"/><circle cx="610" cy="242" r="8" fill="#c58a1c"/><circle cx="610" cy="242" r="16" fill="none" stroke="#72869a" stroke-width="2"/><path d="M610 242L390 304" class="red" stroke-dasharray="9 6"/><text x="118" y="160" class="sm">raio incidente horizontal</text><text x="280" y="112" class="sm">prisma (4°)</text><text x="535" y="165" class="sm">espelho plano</text><text x="632" y="248" class="lbl">O</text><text x="414" y="205" class="sm">raio emergente</text><text x="500" y="310" class="sm">rotação necessária para o retorno paralelo</text></svg>