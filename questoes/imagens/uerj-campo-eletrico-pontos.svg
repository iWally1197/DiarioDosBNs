<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title desc"><title id="title">Pontos em um campo elétrico uniforme</title><desc id="desc">Quatro pontos I, II, III e IV estão alinhados no sentido do campo elétrico uniforme, orientado de I para IV.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2d5f91"/></marker></defs><rect width="720" height="300" rx="16" fill="#f6f8fb"/><text x="28" y="38" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#152238">Pontos em um campo elétrico uniforme</text><text x="28" y="64" font-family="Arial,sans-serif" font-size="13" fill="#536174">A direção do campo vai de I para IV, como descrito no enunciado.</text><path d="M112 142H610" stroke="#2d5f91" stroke-width="3" marker-end="url(#a)"/><text x="342" y="126" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#2d5f91">E</text><g fill="#fff" stroke="#243247" stroke-width="3"><circle cx="145" cy="142" r="13"/><circle cx="290" cy="142" r="13"/><circle cx="435" cy="142" r="13"/><circle cx="580" cy="142" r="13"/></g><g font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#152238" text-anchor="middle"><text x="145" y="190">I</text><text x="290" y="190">II</text><text x="435" y="190">III</text><text x="580" y="190">IV</text></g><text x="28" y="255" font-family="Arial,sans-serif" font-size="13" fill="#536174">Carga de prova positiva em um dos pontos; esquema sem escala.</text></svg>