<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" role="img" aria-labelledby="title desc"><title id="title">Absorção qualitativa de luz por tecidos</title><desc id="desc">Gráfico esquemático de absorção de melanina, oxi-hemoglobina e água por comprimento de onda. A região próxima de 700 nanômetros favorece a absorção por melanina com baixa absorção relativa pelas outras duas.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#243247"/></marker></defs><rect width="700" height="400" rx="16" fill="#f6f8fb"/><text x="28" y="38" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#152238">Absorção relativa em função do comprimento de onda</text><path d="M95 320V82M95 320H630" fill="none" stroke="#243247" stroke-width="2" marker-end="url(#a)"/><text x="52" y="88" font-family="Arial,sans-serif" font-size="14" fill="#243247">absorção</text><text x="478" y="354" font-family="Arial,sans-serif" font-size="14" fill="#243247">comprimento de onda (nm)</text><g font-family="Arial,sans-serif" font-size="12" fill="#536174"><text x="87" y="342">400</text><text x="245" y="342">500</text><text x="400" y="342">700</text><text x="555" y="342">900</text><text x="610" y="342">1100</text></g><path d="M100 110C170 118 205 145 260 175S380 220 450 235S560 245 620 250" fill="none" stroke="#2d5f91" stroke-width="4"/><path d="M100 250C135 92 175 115 210 235C245 125 280 120 320 242C390 260 510 258 620 254" fill="none" stroke="#c44747" stroke-width="4"/><path d="M100 275C280 274 410 272 475 265C535 255 565 205 620 130" fill="none" stroke="#26825d" stroke-width="4"/><path d="M420 85V310" stroke="#c27a18" stroke-width="2" stroke-dasharray="6 5"/><text x="426" y="105" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#a46612">região próxima de 700 nm</text><g font-family="Arial,sans-serif" font-size="13" font-weight="700"><text x="520" y="244" fill="#2d5f91">melanina</text><text x="330" y="216" fill="#c44747">oxi-hemoglobina</text><text x="582" y="122" fill="#26825d">água</text></g><text x="28" y="382" font-family="Arial,sans-serif" font-size="12" fill="#69778b">Esquema qualitativo; curvas sem valores experimentais.</text></svg>