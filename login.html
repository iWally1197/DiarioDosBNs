<!doctype html>
<html lang="pt-BR">
<head>
  <base href="./"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08101f"><title>Entrar — Diário dos BNs</title>
  <link rel="icon" type="image/jpeg" href="assets-diario-dos-bns-logo.jpeg">
  <link rel="stylesheet" href="styles.css?v=site-20261008"><link rel="stylesheet" href="account-system.css?v=site-20261008">
  <script defer src="account-system.js?v=auth-fix-20261008"></script>
</head>
<body data-account-page="login">
  <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
  <header class="site-header">
    <a class="brand" href="index.html"><img class="brand-logo" src="assets-diario-dos-bns-logo.jpeg" alt=""><span>Diário dos <b>BNs</b></span></a>
    <nav class="nav" aria-label="Navegação principal"><a href="index.html">Início</a><a href="turmas.html">Turmas</a><a class="account-link" href="cadastro.html">Criar conta</a></nav>
  </header>
  <main id="conteudo" class="account-page"><section class="account-panel">
    <p class="account-kicker">Área segura · Diário dos BNs</p><h1>Entrar</h1><p>Use o e-mail e a senha da sua conta.</p>
    <form id="login-form" class="account-form" method="post">
      <label for="login-email">E-mail<input id="login-email" name="email" type="email" autocomplete="email" required></label>
      <label for="login-password">Senha<div class="account-password-control"><input id="login-password" name="password" type="password" autocomplete="current-password" required><button class="account-password-toggle" type="button" data-password-toggle="login-password" aria-pressed="false">Mostrar senha</button></div></label>
      <button class="account-button account-button-primary" type="submit">Entrar na conta</button>
      <p class="account-message" data-status aria-live="polite"></p>
    </form>
    <div class="account-actions"><a href="recuperar-senha.html">Esqueci minha senha</a><a href="cadastro.html">Criar conta</a></div>
  </section></main>
</body>
</html>
